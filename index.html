<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WhatIf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=STIX+Two+Text:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --soft:#ECEEF2; --ink:#14161B; --muted:#6A7080; --faint:#9BA1AE;
  --line:#E2E5EA; --accent:#2F43C8; --on-accent:#FFFFFF; --accent-tint:rgba(47,67,200,.07);
  --ok:#1C7A50; --bad:#C23B33; --ok-tint:rgba(28,122,80,.06); --bad-tint:rgba(194,59,51,.06);
  --nav:rgba(245,246,248,.82);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171C; --surface:#1D2026; --soft:#262A31; --ink:#ECEEF2; --muted:#9AA0AD; --faint:#6E7480;
    --line:#2C3038; --accent:#93A4FF; --on-accent:#121524; --accent-tint:rgba(147,164,255,.1);
    --ok:#6FD0A0; --bad:#FF8C83; --ok-tint:rgba(111,208,160,.08); --bad-tint:rgba(255,140,131,.08);
    --nav:rgba(21,23,28,.82);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171C; --surface:#1D2026; --soft:#262A31; --ink:#ECEEF2; --muted:#9AA0AD; --faint:#6E7480;
  --line:#2C3038; --accent:#93A4FF; --on-accent:#121524; --accent-tint:rgba(147,164,255,.1);
  --ok:#6FD0A0; --bad:#FF8C83; --ok-tint:rgba(111,208,160,.08); --bad-tint:rgba(255,140,131,.08);
  --nav:rgba(21,23,28,.82);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;color:var(--ink);background:var(--bg);font-family:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.app{max-width:520px;margin:0 auto;padding:28px 22px 120px;min-height:100vh}

/* формулы */
.fx{font-family:'STIX Two Text','Cambria Math','Times New Roman',serif;font-style:italic;font-weight:400;white-space:nowrap}
.fx sub,.fx sup{font-size:.6em;font-style:normal}
.fx .n{font-style:normal}
.fx .eq,.fx .op{font-style:normal;margin:0 .24em;color:var(--muted)}
.fx .dot{font-style:normal;margin:0 .06em;color:var(--muted)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.88em;margin:0 .08em}
.frac>span{padding:0 .22em;line-height:1.28}
.frac>span:first-child{border-bottom:1.2px solid currentColor}
.rt{display:inline-flex;align-items:stretch;vertical-align:middle}
.rt .rs{font-style:normal;font-size:1.12em;line-height:1}
.rt .rad{border-top:1.2px solid currentColor;padding:.1em .12em 0;display:inline-flex;align-items:center}
.big{font-size:2.2rem;line-height:1.3}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px 24px;margin:18px 0;overflow-x:auto}

/* главная */
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:44px}
.logo{font-family:'STIX Two Text','Times New Roman',serif;font-style:italic;font-weight:500;font-size:1.45rem;line-height:1;margin:0;letter-spacing:-.01em}
.streak{color:var(--muted);font-size:.88rem}
.hero{margin:0 0 30px}
.hero .fx{font-size:3.6rem;line-height:1.15;letter-spacing:-.01em}
.hero p{margin:18px 0 0;font-size:1.15rem;line-height:1.45;max-width:22em}
.lead{margin:0 0 28px;color:var(--muted);font-size:.95rem;max-width:32em}
.title{font-size:1.7rem;font-weight:600;letter-spacing:-.02em;margin:0 0 6px;line-height:1.2}
.status{margin:0 0 14px;color:var(--muted);font-size:.92rem}
h2{font-size:.9rem;font-weight:500;color:var(--muted);margin:44px 0 6px}
.hint{color:var(--faint);font-size:.86rem;margin:10px 0 0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 18px;font-weight:500;min-height:52px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.modes{border-top:1px solid var(--line)}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:18px 0}
.mode:hover .mname{color:var(--accent)}
.mname{font-weight:500;font-size:1.02rem;transition:color .15s}
.mdesc{color:var(--muted);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid transparent;background:var(--soft);border-radius:999px;padding:8px 15px;font-size:.9rem;color:var(--muted);transition:background .15s,color .15s}
.chip.on{background:var(--ink);color:var(--bg)}
.link{background:none;border:0;padding:8px 0;color:var(--muted);font-size:.9rem}
.link:hover{color:var(--ink)}
.reset{margin-top:36px}
.reset .link{color:var(--faint)}

/* вопрос */
.qtop{display:flex;justify-content:space-between;align-items:center}
.count{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
.bar{height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin:10px 0 34px}
.bar span{display:block;height:100%;background:var(--ink);transition:width .4s ease}
.modename{color:var(--faint);font-size:.86rem;margin:0 0 8px}
.qtext{font-size:1.18rem;line-height:1.5;margin:0 0 8px;letter-spacing:-.005em}
.fname{font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:15px 18px;min-height:54px;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:var(--faint)}
.opt.right{border-color:var(--ok);background:var(--ok-tint)}
.opt.wrong{border-color:var(--bad);background:var(--bad-tint)}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ph{font-family:'Golos Text',system-ui,sans-serif;font-style:normal;font-size:.95rem;color:var(--faint)}
.build .fx{white-space:normal}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;margin-top:10px}
.key{min-height:52px;border:0;background:var(--soft);border-radius:12px;font-size:1.25rem;padding:4px;transition:background .12s}
.key:active{background:var(--line)}
.key.v{background:var(--surface);border:1px solid var(--line);font-family:'STIX Two Text','Times New Roman',serif;font-style:italic}
.key.v sub{font-size:.6em;font-style:normal}
.palabel{color:var(--faint);font-size:.84rem;margin:20px 0 0}
.acts{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:22px}
.fb{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 18px;margin:22px 0 0}
.fb .fbt{display:flex;align-items:center;gap:8px}
.fb .fbt::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.fb.bad .fbt::before,.fb.note .fbt::before{background:var(--bad)}
.fb.note{background:transparent}
.fbt{font-weight:600;margin:0 0 4px}
.fbx p{margin:8px 0;color:var(--ink)}
.fbx .fx{font-size:1.35rem}
.fb.final .fbt::before{background:var(--accent)}
.fbx h3{font-size:.84rem;font-weight:500;color:var(--muted);margin:18px 0 4px}
.fbx h3:first-child{margin-top:8px}
.fbx .small{color:var(--muted);font-size:.88rem}
.forms{list-style:none;margin:8px 0 0;padding:0}
.forms li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.forms li .fx{font-size:1.2rem}
.forms li>span:last-child{color:var(--muted);font-size:.84rem;text-align:right}
.about{color:var(--muted);font-size:.9rem;margin:6px 0 0}
.fbrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.next{margin-top:18px}

/* итог */
.endscore{font-family:'STIX Two Text','Times New Roman',serif;font-style:italic;font-size:4rem;line-height:1;margin:0 0 12px;letter-spacing:-.02em}
.endlist{padding:0;margin:8px 0 0;list-style:none;border-top:1px solid var(--line)}
.endlist li{padding:12px 0;border-bottom:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:32px}

/* справочник */
.ref h2{margin-top:40px}
.fitem{padding:18px 0;border-bottom:1px solid var(--line)}
.fitem:first-of-type{border-top:1px solid var(--line)}
.fhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.fhead .fname{font-weight:500}
.fstate{font-size:.78rem;color:var(--faint);white-space:nowrap}
.fstate.learned{color:var(--ok)}
.fstate.due{color:var(--bad)}
.fitem>.fx{font-size:1.6rem;display:inline-block;margin:10px 0 6px}
.legend{margin:2px 0 0;padding:0;list-style:none;color:var(--muted);font-size:.88rem}
.legend li{padding:1px 0}
.legend .fx{font-size:1.02rem;color:var(--ink);margin:0}

/* навигация */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;background:var(--nav);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{flex:0 1 200px;border:0;background:none;border-radius:12px;padding:10px;font-weight:500;font-size:.92rem;color:var(--faint)}
.nav button.on{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;max-width:90vw;z-index:10;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.big{font-size:1.85rem}.hero .fx{font-size:3rem}.app{padding-left:18px;padding-right:18px}}
</style>
</head>
<body>
<main class="app" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
'use strict';
/* ===== Telegram Mini App ===== */
const tg=(window.Telegram&&window.Telegram.WebApp)||null;
const inTG=!!(tg&&tg.initData);
const tgAtLeast=v=>inTG&&typeof tg.isVersionAtLeast==='function'&&tg.isVersionAtLeast(v);
function haptic(kind){if(!tgAtLeast('6.1'))return;try{if(kind==='ok'||kind==='bad')tg.HapticFeedback.notificationOccurred(kind==='ok'?'success':'error');else tg.HapticFeedback.impactOccurred('light');}catch(e){}}
function applyTgTheme(){
  if(!inTG)return;
  document.documentElement.setAttribute('data-theme',tg.colorScheme==='dark'?'dark':'light');
  const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  if(tgAtLeast('6.9')){try{tg.setHeaderColor(bg);tg.setBackgroundColor(bg);}catch(e){}}
}
if(inTG){
  tg.ready();tg.expand();
  if(tgAtLeast('7.7')){try{tg.disableVerticalSwipes();}catch(e){}}
  applyTgTheme();
  tg.onEvent('themeChanged',applyTgTheme);
}

/* ===== Учебный контент ===== */
const D=(m=0,kg=0,s=0,A=0,K=0)=>[m,kg,s,A,K];
const Q={
  m:{s:'m',n:'масса',u:'кг',d:D(0,1)},
  m1:{s:'m<sub>1</sub>',n:'масса первого тела',u:'кг',d:D(0,1)},
  m2:{s:'m<sub>2</sub>',n:'масса второго тела',u:'кг',d:D(0,1)},
  v:{s:'v',n:'скорость',u:'м/с',d:D(1,0,-1)},
  a:{s:'a',n:'ускорение',u:'м/с²',d:D(1,0,-2)},
  F:{s:'F',n:'сила',u:'Н',d:D(1,1,-2)},
  t:{s:'t',n:'время',u:'с',d:D(0,0,1)},
  s:{s:'s',n:'путь',u:'м',d:D(1)},
  h:{s:'h',n:'высота',u:'м',d:D(1)},
  x:{s:'x',n:'удлинение пружины',u:'м',d:D(1)},
  r:{s:'r',n:'расстояние между телами',u:'м',d:D(1)},
  Ek:{s:'E<sub>к</sub>',n:'кинетическая энергия',u:'Дж',d:D(2,1,-2)},
  Ep:{s:'E<sub>п</sub>',n:'потенциальная энергия',u:'Дж',d:D(2,1,-2)},
  A:{s:'A',n:'работа',u:'Дж',d:D(2,1,-2)},
  N:{s:'N',n:'мощность',u:'Вт',d:D(2,1,-3)},
  p:{s:'p',n:'импульс',u:'кг·м/с',d:D(1,1,-1)},
  pr:{s:'p',n:'давление',u:'Па',d:D(-1,1,-2)},
  S:{s:'S',n:'площадь',u:'м²',d:D(2)},
  rho:{s:'ρ',n:'плотность',u:'кг/м³',d:D(-3,1)},
  V:{s:'V',n:'объём',u:'м³',d:D(3)},
  k:{s:'k',n:'жёсткость пружины',u:'Н/м',d:D(0,1,-2)},
  g:{s:'g',n:'ускорение свободного падения',u:'м/с²',d:D(1,0,-2)},
  G:{s:'G',n:'гравитационная постоянная',u:'Н·м²/кг²',d:D(3,-1,-2)},
  I:{s:'I',n:'сила тока',u:'А',d:D(0,0,0,1)},
  U:{s:'U',n:'напряжение',u:'В',d:D(2,1,-3,-1)},
  R:{s:'R',n:'сопротивление',u:'Ом',d:D(2,1,-3,-2)},
  q:{s:'q',n:'заряд',u:'Кл',d:D(0,0,1,1)},
  Q:{s:'Q',n:'количество теплоты',u:'Дж',d:D(2,1,-2)},
  c:{s:'c',n:'удельная теплоёмкость',u:'Дж/(кг·°C)',d:D(2,0,-2,0,-1)},
  v0:{s:'v<sub>0</sub>',n:'начальная скорость',u:'м/с',d:D(1,0,-1)},
  t1:{s:'t<sub>1</sub>',n:'начальная температура',u:'°C',d:D(0,0,0,0,1)},
  t2:{s:'t<sub>2</sub>',n:'конечная температура',u:'°C',d:D(0,0,0,0,1)},
  lam:{s:'λ',n:'длина волны',u:'м',d:D(1)},
  nu:{s:'ν',n:'частота',u:'Гц',d:D(0,0,-1)},
  T:{s:'T',n:'период',u:'с',d:D(0,0,1)},
  Pe:{s:'P',n:'мощность тока',u:'Вт',d:D(2,1,-3)}
};
const CONST=new Set(['g','G']);
const TOPICS=[
  {id:'kin',n:'Кинематика'},{id:'dyn',n:'Динамика'},{id:'cons',n:'Законы сохранения'},
  {id:'hydro',n:'Давление и плотность'},{id:'therm',n:'Тепловые явления'},
  {id:'el',n:'Электричество'},{id:'osc',n:'Колебания и волны'}
];
// Каждая формула: lhs = c · Π(величина^степень)
// Простые законы: lhs = c · Π(величина^степень) — поле e.
// Законы с суммами и разностями: поле rhs (запись через пробелы) и forms — как выразить другие величины.
const F=[
  {id:'speed',topic:'kin',name:'Скорость равномерного движения',lhs:'v',e:{s:1,t:-1}},
  {id:'accel',topic:'kin',name:'Ускорение при равноускоренном движении',lhs:'a',rhs:'( v - v0 ) / t',
    forms:{v:'v0 + a t',v0:'v - a t',t:'( v - v0 ) / a'},gt:[['v','v0']],qn:{v:'конечная скорость'}},
  {id:'disp',topic:'kin',name:'Перемещение при равноускоренном движении',lhs:'s',rhs:'v0 t + a t ² / 2',
    forms:{v0:'s / t - a t / 2',a:'2 ( s - v0 t ) / t ²'},qn:{s:'перемещение'}},
  {id:'freefall',topic:'kin',name:'Высота падения из состояния покоя',lhs:'h',c:[1,2],e:{g:1,t:2}},
  {id:'newton2',topic:'dyn',name:'Второй закон Ньютона',lhs:'F',e:{m:1,a:1}},
  {id:'weight',topic:'dyn',name:'Сила тяжести',lhs:'F',e:{m:1,g:1},qn:{F:'сила тяжести'}},
  {id:'hooke',topic:'dyn',name:'Закон Гука',lhs:'F',e:{k:1,x:1},qn:{F:'сила упругости'}},
  {id:'grav',topic:'dyn',name:'Закон всемирного тяготения',lhs:'F',e:{G:1,m1:1,m2:1,r:-2},qn:{F:'сила притяжения'}},
  {id:'momentum',topic:'cons',name:'Импульс тела',lhs:'p',e:{m:1,v:1}},
  {id:'ek',topic:'cons',name:'Кинетическая энергия',lhs:'Ek',c:[1,2],e:{m:1,v:2}},
  {id:'ep',topic:'cons',name:'Потенциальная энергия тела над землёй',lhs:'Ep',e:{m:1,g:1,h:1}},
  {id:'work',topic:'cons',name:'Механическая работа',lhs:'A',e:{F:1,s:1}},
  {id:'power',topic:'cons',name:'Мощность',lhs:'N',e:{A:1,t:-1}},
  {id:'density',topic:'hydro',name:'Плотность вещества',lhs:'rho',e:{m:1,V:-1}},
  {id:'pressure',topic:'hydro',name:'Давление твёрдого тела',lhs:'pr',e:{F:1,S:-1},qn:{F:'сила давления'}},
  {id:'hydrop',topic:'hydro',name:'Давление жидкости на глубине',lhs:'pr',e:{rho:1,g:1,h:1},qn:{h:'глубина'}},
  {id:'archimedes',topic:'hydro',name:'Сила Архимеда',lhs:'F',e:{rho:1,g:1,V:1},qn:{F:'сила Архимеда',rho:'плотность жидкости',V:'объём погружённой части тела'}},
  {id:'heat',topic:'therm',name:'Количество теплоты при нагревании',lhs:'Q',rhs:'c m ( t2 - t1 )',
    forms:{c:'Q / ( m ( t2 - t1 ) )',m:'Q / ( c ( t2 - t1 ) )',t2:'t1 + Q / ( c m )',t1:'t2 - Q / ( c m )'},gt:[['t2','t1']]},
  {id:'ohm',topic:'el',name:'Закон Ома для участка цепи',lhs:'I',e:{U:1,R:-1}},
  {id:'charge',topic:'el',name:'Заряд, прошедший по проводнику',lhs:'q',e:{I:1,t:1}},
  {id:'pel',topic:'el',name:'Мощность электрического тока',lhs:'Pe',e:{U:1,I:1}},
  {id:'joule',topic:'el',name:'Закон Джоуля — Ленца',lhs:'Q',e:{I:2,R:1,t:1}},
  {id:'wave',topic:'osc',name:'Скорость волны',lhs:'v',e:{lam:1,nu:1}},

const INTERVALS=[0,1,2,4,7,15];

function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function yesterdayKey(){const y=new Date();y.setDate(y.getDate()-1);return dayKey(y);}
function touchStreak(){const t=dayKey();if(S.streak.last===t)return;S.streak.n=S.streak.last===yesterdayKey()?S.streak.n+1:1;S.streak.last=t;}

function record(id,ok){
  const p=Object.assign({},prog(id));
  if(ok){p.r++;p.lv=Math.min(5,p.lv+1);p.next=Date.now()+INTERVALS[p.lv]*864e5;}

}
function pickFormula(recent,filt){

    return {f,sc:(due?0:seen?8:4)+p.lv+Math.random()*3+(recent.includes(f.id)?30:0)};});

/* ===== Алгебра формул ===== */
function solve(f,t){
  const coef=f.c||[1,1];
  if(t===f.lhs)return {inner:Object.assign({},f.e),ic:coef.slice(),root:1};
  const et=f.e[t],s=Math.sign(et),mm=Math.abs(et);
  const inner={};inner[f.lhs]=s;
  for(const v in f.e)if(v!==t)inner[v]=-s*f.e[v];
  return {inner,ic:s>0?[coef[1],coef[0]]:[coef[0],coef[1]],root:mm};
}
function exps(sol){const o={};for(const v in sol.inner)o[v]=sol.inner[v]/sol.root;return o;}
function trueVal(sol,env){let r=Math.pow(sol.ic[0]/sol.ic[1],1/sol.root);const e=exps(sol);for(const v in e)r*=Math.pow(env[v],e[v]);return r;}
function qHTMLsym(id,e){let s=Q[id].s;if(Math.abs(e)===2)s+='<sup>2</sup>';return s;}
function solHTML(sol){
  const num=[],den=[];
  if(sol.ic[0]!==1)num.push(`<span class="n">${sol.ic[0]}</span>`);
  if(sol.ic[1]!==1)den.push(`<span class="n">${sol.ic[1]}</span>`);
  for(const v in sol.inner){const e=sol.inner[v];if(e>0)num.push(qHTMLsym(v,e));else if(e<0)den.push(qHTMLsym(v,e));}
  const join=a=>a.join('<span class="dot">·</span>');
  let body=num.length?join(num):'<span class="n">1</span>';
  if(den.length)body=`<span class="frac"><span>${body}</span><span>${join(den)}</span></span>`;
  if(sol.root===2)body=`<span class="rt"><span class="rs">√</span><span class="rad">${body}</span></span>`;
  return body;
}
const eqHTML=(t,sol)=>`<span class="fx">${Q[t].s}<span class="eq">=</span>${solHTML(sol)}</span>`;

/* ===== Размерности ===== */
const dz=()=>[0,0,0,0,0];
const dadd=(a,b,k)=>a.map((x,i)=>x+(k===undefined?1:k)*b[i]);
const dscale=(a,k)=>a.map(x=>x*k);
const deq=(a,b)=>a.every((x,i)=>Math.abs(x-b[i])<1e-9);
function solDim(sol){let d=dz();for(const v in sol.inner)d=dadd(d,Q[v].d,sol.inner[v]);return dscale(d,1/sol.root);}
const NAMED=[['Н',D(1,1,-2)],['Дж',D(2,1,-2)],['Вт',D(2,1,-3)],['Па',D(-1,1,-2)],['В',D(2,1,-3,-1)],['Ом',D(2,1,-3,-2)],['Кл',D(0,0,1,1)],['Гц',D(0,0,-1)]];
const BASE=['м','кг','с','А','К'],ORDER=[1,0,2,3,4];
function expSup(e){if(e===1)return '';const t=Number.isInteger(e)?String(e):(e===.5?'1/2':e===1.5?'3/2':fmtX(e));return `<sup>${t}</sup>`;}
function unitHTML(d){
  if(d.every(x=>Math.abs(x)<1e-9))return 'безразмерное число';
  for(const [n,u] of NAMED)if(deq(d,u))return n;
  const num=[],den=[];
  for(const i of ORDER){const e=d[i];if(e>1e-9)num.push(BASE[i]+expSup(e));else if(e<-1e-9)den.push(BASE[i]+expSup(-e));}
  return (num.length?num.join('·'):'1')+(den.length?'/'+den.join('·'):'');
}

/* ===== Разбор формулы из блоков ===== */
function PErr(code){this.code=code;}
const PMSG={empty:'Собери формулу из блоков.',end:'Формула не дописана: после знака должна стоять величина или число.',paren:'Скобки не закрыты или стоят лишние.',unexpected:'Знаки стоят в неправильном порядке. Проверь, что между величинами нет двух знаков подряд.'};
function parse(toks){
  let i=0;const peek=()=>toks[i];
  function expr(){let a=term();while(peek()&&peek().k==='op'&&(peek().v==='+'||peek().v==='-')){const op=toks[i++].v;a={t:'bin',op,a,b:term()};}return a;}
  function term(){let a=unary();for(;;){const p=peek();if(!p)break;
    if(p.k==='op'&&(p.v==='*'||p.v==='/')){i++;a={t:'bin',op:p.v,a,b:unary()};}
    else if(p.k==='v'||p.k==='n'||p.k==='('||p.k==='rt'){a={t:'bin',op:'*',a,b:unary()};}
    else break;}return a;}
  function unary(){const p=peek();if(p&&p.k==='op'&&p.v==='-'){i++;return {t:'neg',a:unary()};}return power();}
  function power(){let a=primary();while(peek()&&peek().k==='sq'){i++;a={t:'sq',a};}return a;}
  function primary(){const p=toks[i++];if(!p)throw new PErr('end');
    if(p.k==='n')return {t:'num',v:p.v};
    if(p.k==='v')return {t:'var',id:p.id};
    if(p.k==='('){const e=expr();if(!peek()||peek().k!==')')throw new PErr('paren');i++;return e;}
    if(p.k==='rt')return {t:'sqrt',a:power()};
    throw new PErr(p.k===')'?'paren':'unexpected');}
  if(!toks.length)throw new PErr('empty');
  const e=expr();if(i<toks.length)throw new PErr(toks[i].k===')'?'paren':'unexpected');return e;
}
function evN(n,env){switch(n.t){
  case 'num':return n.v;case 'var':return env[n.id];case 'neg':return -evN(n.a,env);
  case 'sq':{const x=evN(n.a,env);return x*x;}case 'sqrt':return Math.sqrt(evN(n.a,env));
  case 'bin':{const a=evN(n.a,env),b=evN(n.b,env);return n.op==='+'?a+b:n.op==='-'?a-b:n.op==='*'?a*b:a/b;}}}
function evD(n){switch(n.t){
  case 'num':return dz();case 'var':return Q[n.id].d.slice();case 'neg':return evD(n.a);
  case 'sq':return dscale(evD(n.a),2);case 'sqrt':return dscale(evD(n.a),.5);
  case 'bin':{const a=evD(n.a),b=evD(n.b);
    if(n.op==='+'||n.op==='-'){if(!deq(a,b))throw {add:true,da:a,db:b};return a;}
    return n.op==='*'?dadd(a,b):dadd(a,b,-1);}}}
function collect(n,set){set=set||new Set();if(n.t==='var')set.add(n.id);if(n.a)collect(n.a,set);if(n.b)collect(n.b,set);return set;}

function tokenize(str){return str.trim().split(/\s+/).map(w=>{
  if(/^\d+(\.\d+)?$/.test(w))return {k:'n',v:+w};
  if(w.length===1&&'+-*/'.includes(w))return {k:'op',v:w};
  if(w==='('||w===')')return {k:w};
  if(w==='²')return {k:'sq'};
  if(w==='√')return {k:'rt'};
  if(!Q[w])throw new Error('Неизвестная величина '+w);
  return {k:'v',id:w};});}
const mono=f=>!f.rhs;
const nm=(f,id)=>(f&&f.qn&&f.qn[id])||Q[id].n;
F.forEach(f=>{if(mono(f))return;f.rhsAst=parse(tokenize(f.rhs));f.formAst={};f.formAst[f.lhs]=f.rhsAst;for(const t in f.forms)f.formAst[t]=parse(tokenize(f.forms[t]));});
function fVars(f){return mono(f)?[f.lhs].concat(Object.keys(f.e)):[f.lhs].concat([...collect(f.rhsAst)]);}
function astHTML(n){
  const wrap=c=>`<span class="n">(</span>${astHTML(c)}<span class="n">)</span>`;
  const isAdd=c=>c.t==='bin'&&(c.op==='+'||c.op==='-');
  switch(n.t){
    case 'num':return `<span class="n">${n.v}</span>`;
    case 'var':return Q[n.id].s;
    case 'neg':return `<span class="op">−</span>${isAdd(n.a)?wrap(n.a):astHTML(n.a)}`;
    case 'sq':return (n.a.t==='var'||n.a.t==='num'?astHTML(n.a):wrap(n.a))+'<sup>2</sup>';
    case 'sqrt':return `<span class="rt"><span class="rs">√</span><span class="rad">${astHTML(n.a)}</span></span>`;
    case 'bin':
      if(n.op==='/')return `<span class="frac"><span>${astHTML(n.a)}</span><span>${astHTML(n.b)}</span></span>`;
      if(n.op==='*')return (isAdd(n.a)?wrap(n.a):astHTML(n.a))+'<span class="dot">·</span>'+(isAdd(n.b)?wrap(n.b):astHTML(n.b));
      return astHTML(n.a)+`<span class="op">${n.op==='+'?'+':'−'}</span>`+(n.op==='-'&&isAdd(n.b)?wrap(n.b):astHTML(n.b));
  }
}
const formHTML=(f,t)=>mono(f)?solHTML(solve(f,t)):astHTML(f.formAst[t]);
const eqF=(f,t)=>`<span class="fx">${Q[t].s}<span class="eq">=</span>${formHTML(f,t)}</span>`;
const eqAst=(t,ast)=>`<span class="fx">${Q[t].s}<span class="eq">=</span>${astHTML(ast)}</span>`;
function rhsVal(f,env){if(mono(f)){const c=f.c||[1,1];let r=c[0]/c[1];for(const v in f.e)r*=Math.pow(env[v],f.e[v]);return r;}return evN(f.rhsAst,env);}
// Случайные, но согласованные значения: конечная скорость больше начальной и т. п.
function makeEnv(f,extra,lo,hi){lo=lo||0.7;hi=hi||4;const env={};
  fVars(f).concat(extra||[]).forEach(v=>{env[v]=lo+Math.random()*(hi-lo);});
  (f.gt||[]).forEach(([a,b])=>{if(env[a]<=env[b])env[a]=env[b]+0.5+Math.random()*2;});
  env[f.lhs]=rhsVal(f,env);return env;}
const trueEval=(q,env)=>mono(q.f)?trueVal(q.sol,env):evN(q.f.formAst[q.t],env);

const REL={'1':'прямо пропорциональна','-1':'обратно пропорциональна','2':'пропорциональна квадрату','-2':'обратно пропорциональна квадрату','0.5':'пропорциональна корню из','-0.5':'обратно пропорциональна корню из'};
const relText=e=>REL[String(Math.round(e*2)/2)]||'зависит по-другому от';
function depHint(q,d){
  const t=q.t,f=q.f,v=d.v;
  if(Math.abs(d.te)<1e-9)return `Величина ${sym(v)} (${nm(f,v)}) здесь лишняя: ${nm(f,t)} от неё не зависит.`;
  if(Math.abs(d.ue)<1e-9)return `Величина ${sym(t)} зависит от ${sym(v)} (${nm(f,v)}), а в твоей формуле её нет.`;
  if(Math.sign(d.ue)!==Math.sign(d.te))return d.te>0
    ?`Если увеличить ${sym(v)}, величина ${sym(t)} должна расти, а по твоей формуле она уменьшается.`
    :`Если увеличить ${sym(v)}, величина ${sym(t)} должна уменьшаться, а по твоей формуле она растёт.`;
  if(mono(f))return `Зависимость от ${sym(v)} не та: величина ${sym(t)} ${relText(d.te)} ${sym(v)}, а у тебя получилось, что она ${relText(d.ue)} ${sym(v)}.`;
  return 'Все нужные величины на месте, но связаны не так. Проверь каждое слагаемое: не пропущен ли множитель вроде ½, квадрат или скобки.';
}
const LIGHT={
  add:'Где-то складываются или вычитаются величины разной природы. Посмотри на знаки «+» и «−».',
  sign:'Знак получается не тот. Посмотри на порядок вычитания.',
  missing:'Не хватает одной из величин.',
  extra:'В формуле есть лишняя величина.',
  dim:'Единицы слева и справа не совпадают. Подумай, в чём измеряется искомая величина.',
  dir:'Одна из величин стоит не на своём месте. Может, перепутаны числитель и знаменатель?',
  coef:'Почти верно. Проверь числовой множитель.',
  other:'Связь между величинами не та. Подумай, от чего и как зависит искомая величина.',
  nan:'При некоторых значениях формула не имеет смысла. Проверь знаки и деление.'
};
function checkBuild(q){
  let ast;try{ast=parse(q.toks);}catch(e){if(e instanceof PErr)return {soft:true,msg:PMSG[e.code]};throw e;}
  if(collect(ast).has(q.t))return {soft:true,msg:`Справа не должно быть самой величины ${sym(q.t)}: её мы и выражаем.`};
  let dim=null,addErr=null;try{dim=evD(ast);}catch(e){if(e&&e.add)addErr=e;else throw e;}
  let ok=!addErr;
  for(let k=0;k<6&&ok;k++){const env=makeEnv(q.f,q.palette);const a=evN(ast,env),b=trueEval(q,env);
    if(!isFinite(a)||Math.abs(a-b)>1e-7*Math.max(1,Math.abs(b)))ok=false;}
  if(ok)return {ok:true};
  const hints=[];let type=null;
  const dimBad=!addErr&&!deq(dim,Q[q.t].d);
  if(addErr){type='add';hints.push(`<p>Здесь складываются или вычитаются величины разной природы: ${unitHTML(addErr.da)} и ${unitHTML(addErr.db)}. Это как сложить метры с секундами.</p>`);}
  else if(dimBad)hints.push(`<p>Единицы не сходятся: ${sym(q.t)} измеряется в ${Q[q.t].u}, а справа получается ${unitHTML(dim)}.</p>`);
  if(!addErr){
    const env=makeEnv(q.f,q.palette,1.3,2.3);const ub=evN(ast,env),tb=trueEval(q,env);
    if(!isFinite(ub)){type='nan';hints.push('<p>При некоторых значениях получается деление на ноль или корень из отрицательного числа. Проверь знаки.</p>');}
    else if(Math.sign(ub)!==Math.sign(tb)){type='sign';hints.push('<p>Получается значение с обратным знаком. Проверь порядок вычитания: обычно из конечного значения вычитают начальное.</p>');}
    else if((()=>{const r0=ub/tb;for(let i=0;i<4;i++){const e=makeEnv(q.f,q.palette,1.3,2.3);if(Math.abs(evN(ast,e)/trueEval(q,e)-r0)>1e-6*Math.abs(r0))return false;}return true;})()){
      type='coef';hints.push('<p>Все величины на месте и связаны верно, но не тот числовой множитель. Проверь, нужен ли коэффициент вроде 2.</p>');}
    else{
      const diffs=[];
      for(const v of [...new Set(fVars(q.f).concat(q.palette))].filter(v=>v!==q.t)){
        const e2=Object.assign({},env);e2[v]=env[v]*2;
        const ue=Math.log2(Math.abs(evN(ast,e2)/ub)),te=Math.log2(Math.abs(trueEval(q,e2)/tb));
        if(isFinite(ue)&&isFinite(te)&&Math.abs(ue-te)>0.02)diffs.push({v,ue,te});
      }
      const rank=d=>Math.abs(d.te)<1e-9||Math.abs(d.ue)<1e-9?0:Math.sign(d.ue)!==Math.sign(d.te)?1:2;
      diffs.sort((a,b)=>rank(a)-rank(b));
      if(diffs.length){const d=diffs[0];
        type=Math.abs(d.ue)<1e-9?'missing':Math.abs(d.te)<1e-9?'extra':dimBad?'dim':Math.sign(d.ue)!==Math.sign(d.te)?'dir':'other';
        hints.push(`<p>${depHint(q,d)}</p>`);}
      else{type=dimBad?'dim':'coef';if(!hints.length)hints.push('<p>Все зависимости верные, но не тот числовой множитель. Проверь, нужен ли коэффициент вроде 2.</p>');}
    }
  }
  return {ok:false,light:`<p>${LIGHT[type||(dimBad?'dim':'other')]}</p>`,msg:hints.join('')};
}

/* ===== Генераторы вопросов ===== */
function varsOf(f){return mono(f)?[f.lhs].concat(Object.keys(f.e)).filter(v=>!CONST.has(v)):[f.lhs].concat(Object.keys(f.forms));}
function change(R){if(Math.abs(R-1)<1e-9)return 'не изменится';const X=R>1?R:1/R;return `${R>1?'увеличится':'уменьшится'} в ${fmtX(X)} ${timesWord(Math.round(X))}`;}
const isNice=R=>{const X=R>1?R:1/R;return Math.abs(X-Math.round(X))<1e-9&&X<=100;};
function genWhatIf(f){
  const pool=varsOf(f);const t=pick(pool);const c=pick(pool.filter(v=>v!==t));
  const sol=solve(f,t);const r=exps(sol)[c];const up=Math.random()<.6;
  const k=pick(Math.abs(r)===.5?[4,9]:Math.abs(r)===2?[2,3]:[2,3,4]);
  const R=Math.pow(k,up?r:-r);const correct=change(R);
  const labels=[];const inv=change(1/R);if(inv!==correct)labels.push(inv);
  if(correct!=='не изменится')labels.push('не изменится');
  for(const x of shuffle([k,1/k,R*R,1/(R*R),k*k,1/(k*k)]).filter(isNice)){const l=change(x);if(l!==correct&&!labels.includes(l))labels.push(l);}
  return {f,t,c,sol,correct,opts:shuffle([correct].concat(labels.slice(0,3))),
    text:`<span class="fname">${f.name}.</span> Величину ${sym(c)} (${nm(f,c)}) ${up?'увеличили':'уменьшили'} в ${k} ${timesWord(k)}, остальные величины в формуле не меняются. Как изменится ${nm(f,t)} ${sym(t)}?`,
    expl:`<p>${eqF(f,t)}</p><p>Величина ${sym(t)} ${relText(r)} ${sym(c)}, поэтому она ${correct}.</p>`};
}
function genBuild(f){
  const t=pick(varsOf(f));const sol=mono(f)?solve(f,t):null;
  const own=fVars(f).filter(v=>v!==t);
  const used=new Set(own.map(v=>Q[v].s).concat([Q[t].s]));
  const extraPool=shuffle(F.filter(g=>g.topic===f.topic&&g.id!==f.id).concat(shuffle(F).slice(0,4)).flatMap(fVars));
  const extra=[];for(const v of extraPool){if(extra.length>=2)break;if(own.includes(v)||v===t||used.has(Q[v].s))continue;used.add(Q[v].s);extra.push(v);}
  return {f,t,sol,palette:shuffle(own.concat(extra)),toks:[],fb:null,counted:false};
}
function mutateAst(ast){
  const c=JSON.parse(JSON.stringify(ast)),cands=[];
  const replaceWith=(n,src)=>{const s=JSON.parse(JSON.stringify(src));for(const k in n)delete n[k];Object.assign(n,s);};
  (function walk(n){
    if(n.t==='bin'){
      if(n.op==='-'){cands.push(['swap',()=>{const x=n.a;n.a=n.b;n.b=x;}]);cands.push(['sign',()=>{n.op='+';}]);}
      if(n.op==='+'){cands.push(['sign',()=>{n.op='-';}]);cands.push(['drop',()=>replaceWith(n,n.a)]);cands.push(['drop',()=>replaceWith(n,n.b)]);}
      if(n.op==='/')cands.push(['muldiv',()=>{n.op='*';}]);
      if(n.op==='*')cands.push(['muldiv',()=>{n.op='/';}]);
    }
    if(n.t==='sq')cands.push(['pow',()=>replaceWith(n,n.a)]);
    if(n.a)walk(n.a);if(n.b)walk(n.b);
  })(c);
  if(!cands.length)return null;const [kind,fn]=pick(cands);fn();return {ast:c,kind};
}
const MUTMSG={swap:'Перепутан порядок вычитания, поэтому величина получится с обратным знаком.',sign:'Перепутан знак между слагаемыми. Единицы такую ошибку не ловят, поэтому проверяй смысл: величина должна расти или уменьшаться?',drop:'Пропущено слагаемое.',muldiv:'Перепутаны умножение и деление.',pow:'Пропущен квадрат.'};
function verdictCorrect(f,t){return `<p>Исходная формула: ${eqF(f,f.lhs)}${t!==f.lhs?`. Из неё выражена величина ${sym(t)}.`:'.'}</p><p>Единицы сходятся: обе части измеряются в ${Q[t].u}.</p>`;}
function genVerdict(f){
  const t=pick(varsOf(f));let wrong=Math.random()<.55;
  if(!mono(f)){
    const ast=f.formAst[t];let shown=ast,kind=null;
    if(wrong){for(let i=0;i<15&&!kind;i++){const r=mutateAst(ast);if(!r)break;const env=makeEnv(f,[]);const a=evN(r.ast,env),b=evN(ast,env);
      if(isFinite(a)&&Math.abs(a-b)>1e-6*Math.max(1,Math.abs(b))){shown=r.ast;kind=r.kind;}}
      if(!kind)wrong=false;}
    let expl;
    if(!wrong)expl=verdictCorrect(f,t);
    else{expl=`<p>Правильно: ${eqF(f,t)}</p>`;let md=null,add=false;try{md=evD(shown);}catch(e){add=true;}
      if(add)expl+='<p>Ошибку видно по единицам: здесь складываются величины разной природы.</p>';
      else if(!deq(md,Q[t].d))expl+=`<p>Ошибку видно по единицам: справа получается ${unitHTML(md)}, а ${sym(t)} измеряется в ${Q[t].u}.</p>`;
      else expl+=`<p>${MUTMSG[kind]}</p>`;}
    return {f,t,wrong,shownHTML:eqAst(t,shown),expl};
  }
  const sol=solve(f,t);let shown=sol,mut=null;
  if(wrong){
    const vs=Object.keys(sol.inner);const muts=[];
    vs.forEach(v=>{muts.push({k:'flip',v});muts.push({k:'pow',v});if(vs.length>1)muts.push({k:'drop',v});});
    if(sol.ic[0]!==1||sol.ic[1]!==1)muts.push({k:'coef'});
    if(sol.root===2)muts.push({k:'root'});
    mut=pick(muts);const inner=Object.assign({},sol.inner);let ic=sol.ic.slice(),root=sol.root;
    if(mut.k==='flip')inner[mut.v]=-inner[mut.v];
    if(mut.k==='pow')inner[mut.v]=Math.sign(inner[mut.v])*(Math.abs(inner[mut.v])===2?1:2);
    if(mut.k==='drop')delete inner[mut.v];
    if(mut.k==='coef')ic=[1,1];
    if(mut.k==='root')root=1;
    shown={inner,ic,root};
  }
  let expl;
  if(!wrong)expl=verdictCorrect(f,t);
  else{
    expl=`<p>Правильно: ${eqF(f,t)}</p>`;
    const md=solDim(shown);
    if(!deq(md,Q[t].d))expl+=`<p>Ошибку видно по единицам: справа получается ${unitHTML(md)}, а ${sym(t)} измеряется в ${Q[t].u}.</p>`;
    if(mut.k==='flip'||mut.k==='pow'||mut.k==='drop')expl+=`<p>Величина ${sym(t)} ${relText(exps(sol)[mut.v])} ${sym(mut.v)}${mut.k==='drop'?', а здесь её нет':''}.</p>`;
    if(mut.k==='coef')expl+='<p>Пропущен числовой множитель. Единицы его не ловят, поэтому его стоит запомнить.</p>';
    if(mut.k==='root')expl+='<p>Пропущен квадратный корень.</p>';
  }
  return {f,t,wrong,shownHTML:`<span class="fx">${Q[t].s}<span class="eq">=</span>${solHTML(shown)}</span>`,expl};
}

const root=document.getElementById('app');
let view='home',sess=null,resetArm=false;
function startSession(mode){sess={mode,n:8,i:0,score:0,done:0,wrong:[],recent:[]};nextQ();}
function nextQ(){
  if(sess.i>=sess.n){view='end';render();return;}
  const m=sess.mode==='mix'?pick(['whatif','build','verdict']):sess.mode;
  const f=pickFormula(sess.recent,m==='whatif'?mono:null);sess.recent.push(f.id);if(sess.recent.length>5)sess.recent.shift();
  const q=m==='whatif'?genWhatIf(f):m==='build'?genBuild(f):genVerdict(f);
  q.mode=m;sess.q=q;sess.answered=false;view='q';render();
}
function finish(ok){haptic(ok?'ok':'bad');const q=sess.q;sess.done++;if(ok)sess.score++;else if(!sess.wrong.includes(q.f.id))sess.wrong.push(q.f.id);record(q.f.id,ok);}

function stats(){
  const now=Date.now();let seen=0,learned=0,due=0;
  for(const f of F){if(!S.prog[f.id])continue;seen++;const p=prog(f.id);if(p.lv>=3)learned++;if(p.next<=now)due++;}
  return {seen,learned,due};
}

function fbHTML(kind,title,html){return `<div class="fb ${kind}" role="status"><p class="fbt">${title}</p><div class="fbx">${html}</div></div>`;}
const nextBtn=()=>`<button class="btn primary wide next" data-act="next">${sess.i+1>=sess.n?'Посмотреть итог':'Дальше'}</button>`;

const KEYS=[['op:*','·','умножить'],['op:/','/','разделить'],['op:+','+','плюс'],['op:-','−','минус'],['(:','(','открыть скобку'],['):',')','закрыть скобку'],['sq:','x²','в квадрат'],['rt:','√','корень'],['n:1','1','один'],['n:2','2','два'],['del:','⌫','стереть']];

    ${KEYS.map(([k,l,a])=>`<button class="key o" data-act="${k==='del:'?'del':'tok'}" data-k="${k}" aria-label="${a}">${l}</button>`).join('')}
  </div>
  <div class="acts"><button class="btn primary" data-act="check" ${q.toks.length?'':'disabled'}>Проверить</button><button class="btn" data-act="reveal">Не знаю</button></div>
  ${q.wrongs?`<p class="hint">Попытка ${q.wrongs+1} из 3</p>`:''}`;
  return out;
}
function verdictHTML(q){
  let out=`<p class="qtext"><span class="fname">${q.f.name}.</span> Эта запись верна?</p>
  <div class="sheet"><span class="big">${q.shownHTML}</span></div>`;
  if(!sess.answered)return out+`<div class="two"><button class="btn" data-act="verdict" data-v="ok">Верна</button><button class="btn" data-act="verdict" data-v="bad">Есть ошибка</button></div>`;
  const title=q.chosenOk?(q.wrong?'Верно, здесь ошибка':'Верно, формула правильная'):(q.wrong?'Здесь есть ошибка':'Формула правильная');
  return out+fbHTML(q.chosenOk?'ok':'bad',title,q.expl)+nextBtn();
}
function qHTML(){
  const q=sess.q,pct=Math.round(sess.i/sess.n*100);
  const body=q.mode==='whatif'?whatifHTML(q):q.mode==='build'?buildHTML(q):verdictHTML(q);
  return `<div class="qtop"><button class="link" data-act="quit">Закончить</button><span class="count">Вопрос ${sess.i+1} из ${sess.n}</span></div>
  <div class="bar" aria-hidden="true"><span style="width:${pct}%"></span></div>
  <p class="modename">${MODEN[q.mode]}</p>${body}`;
}
function endHTML(){
  const wrong=sess.wrong.map(id=>F.find(f=>f.id===id));
  return `<header class="head"><span class="logo">WhatIf</span></header>
  <p class="endscore">${sess.score} из ${sess.done}</p>
  <p class="lead" style="margin:0">${sess.done===0?'Ни одного ответа в этой тренировке.':sess.score===sess.done?'Все ответы верные с первой попытки.':'Верных ответов с первой попытки.'}</p>
  ${wrong.length?`<h2>Эти формулы вернутся раньше</h2><ul class="endlist">${wrong.map(f=>`<li>${f.name}</li>`).join('')}</ul>`:''}
  <div class="stack"><button class="btn primary wide" data-act="again">Ещё тренировка</button><button class="btn wide" data-act="home">На главную</button></div>`;
}
function refHTML(){
  const now=Date.now();
  return `<h1 class="title">Справочник</h1><p class="lead">Все формулы тренажёра с величинами и единицами.</p><div class="ref">
  ${TOPICS.map(t=>`<h2>${t.n}</h2>${F.filter(f=>f.topic===t.id).map(f=>{
    const p=prog(f.id),seen=!!S.prog[f.id];
    const st=!seen?['','Новая']:p.lv>=3?['learned','Выучена']:p.next<=now?['due','Пора повторить']:['','Учу'];
    const vars=fVars(f);
    return `<div class="fitem"><div class="fhead"><span class="fname">${f.name}</span><span class="fstate ${st[0]}">${st[1]}</span></div>
      ${eqF(f,f.lhs)}
      <p class="about">${f.about}</p>
      <ul class="legend">${vars.map(v=>`<li>${sym(v)} — ${nm(f,v)}, ${Q[v].u}</li>`).join('')}</ul></div>`;}).join('')}`).join('')}</div>`;
}
const navHTML=()=>`<nav class="nav"><button data-act="nav" data-v="home" class="${view==='home'?'on':''}">Тренировка</button><button data-act="nav" data-v="ref" class="${view==='ref'?'on':''}">Справочник</button></nav>`;
function render(){
  let h='';
  if(view==='home')h=homeHTML()+navHTML();
  else if(view==='ref')h=refHTML()+navHTML();
  else if(view==='q')h=qHTML();
  else if(view==='end')h=endHTML();
  root.innerHTML=h;
  if(inTG&&tgAtLeast('6.1')){if(view==='home')tg.BackButton.hide();else tg.BackButton.show();}
}
if(inTG&&tgAtLeast('6.1'))tg.BackButton.onClick(()=>{
  if(view==='q'){view=sess.done>0?'end':'home';}else view='home';
  render();window.scrollTo(0,0);
});
let toastT=null;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2600);}

/* ===== Действия ===== */
root.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,q=sess&&sess.q;
  switch(a){
    case 'start':startSession(b.dataset.mode);window.scrollTo(0,0);break;
    case 'topic':{const id=b.dataset.id;if(S.topics.includes(id)){if(S.topics.length===1){toast('Нужна хотя бы одна тема');return;}S.topics=S.topics.filter(x=>x!==id);}else S.topics.push(id);save();render();break;}
    case 'reset':if(!resetArm){resetArm=true;render();setTimeout(()=>{if(resetArm){resetArm=false;if(view==='home')render();}},4000);}
      else{S=fresh();save();resetArm=false;render();toast('Прогресс стёрт');}break;
    case 'nav':view=b.dataset.v;render();window.scrollTo(0,0);break;
    case 'quit':view=sess.done>0?'end':'home';render();window.scrollTo(0,0);break;
    case 'opt':{const i=+b.dataset.i;q.chosen=i;q.chosenOk=q.opts[i]===q.correct;sess.answered=true;finish(q.chosenOk);render();break;}
    case 'verdict':{q.chosenOk=(b.dataset.v==='bad')===q.wrong;sess.answered=true;finish(q.chosenOk);render();break;}
    case 'tok':{haptic('tap');const [kind,val]=b.dataset.k.split(':');let t;
      if(kind==='v')t={k:'v',id:val};else if(kind==='n')t={k:'n',v:+val};else if(kind==='op')t={k:'op',v:val};else t={k:kind};
      q.toks.push(t);if(q.fb&&q.fb.kind==='soft')q.fb=null;render();break;}
    case 'del':q.toks.pop();if(q.fb&&q.fb.kind==='soft')q.fb=null;render();break;
    case 'check':{const r=checkBuild(q);
      if(r.soft){q.fb={kind:'soft',msg:r.msg};}
      else if(r.ok){q.fb={kind:'ok'};if(!q.counted){q.counted=true;finish(true);}sess.answered=true;}
      else{q.wrongs=(q.wrongs||0)+1;if(!q.counted){q.counted=true;finish(false);}
        if(q.wrongs>=3){q.fb={kind:'final',msg:r.msg,toks:q.toks.slice()};sess.answered=true;}
        else q.fb={kind:'bad',msg:q.wrongs===1?r.light:r.msg};}
      render();break;}
    case 'fix':q.fb=null;render();break;
    case 'reveal':if(!q.counted){q.counted=true;finish(false);}q.fb={kind:'reveal'};sess.answered=true;render();break;
    case 'report':S.reports.push({formula:q.f.id,target:q.t,answer:q.toks.map(t=>t.k==='v'?t.id:t.k==='n'?t.v:t.v||t.k).join(' '),date:new Date().toISOString()});
      save();q.reported=true;render();toast('Сообщение сохранено на этом устройстве');break;
    case 'next':sess.i++;nextQ();window.scrollTo(0,0);break;
    case 'again':startSession(sess.mode);window.scrollTo(0,0);break;
    case 'home':view='home';render();window.scrollTo(0,0);break;
  }
});
render();
</script>
</body>
</html>
